<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicAid - Bio Signal Processor</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="pulse-circle"></div>
                <h1>SonicAid</h1>
            </div>
            <p class="subtitle">Real-time Bio-Signal Noise Reduction</p>
        </header>

        <main class="control-panel">
            <!-- Visualizer -->
            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <!-- Main Toggle -->
            <div class="power-switch">
                <button id="toggleBtn" class="btn-power">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                    <span>Start System</span>
                </button>
            </div>

            <!-- Controls Grid -->
            <div class="controls-grid">
                <!-- Volume Control -->
                <div class="control-card">
                    <div class="card-header">
                        <span class="icon">🔊</span>
                        <h3>Amplification</h3>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="volumeSlider" min="1" max="10" step="0.1" value="1">
                        <div class="value-display" id="volumeValue">1.0x</div>
                    </div>
                </div>

                <!-- Noise Gate Control -->
                <div class="control-card">
                    <div class="card-header">
                        <span class="icon">🛡️</span>
                        <h3>Noise Gate</h3>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="thresholdSlider" min="0" max="0.1" step="0.001" value="0.01">
                        <div class="value-display" id="thresholdValue">0.01</div>
                    </div>
                </div>
            </div>
            
            <div class="status-bar">
                <span class="status-indicator"></span>
                <span id="statusText">System Standby</span>
            </div>
        </main>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
